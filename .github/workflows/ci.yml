name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: npm ci

      - name: Documentation and Spec Validation
        run: |
          python scripts/validate_docs.py
          python scripts/render_tasks.py --check
          python -m unittest discover -s tests -p test_docs_validation.py -v

      - name: Lint and Typecheck
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Build Application & Workspaces
        run: npm run build
